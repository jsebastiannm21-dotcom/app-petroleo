# Tareas programadas en la nube (gratis): funcionan aunque tu computador esté apagado.
# Horas en UTC: Bogotá = UTC - 5. GitHub puede atrasarlas unos minutos en horas de mucho uso.
name: Tareas programadas
on:
  schedule:
    - cron: "0 13 * * 1-5"         # 8:00 a.m. reporte del día
    - cron: "45 14 * * 1-5"        # 9:45 a.m. qué comprar y vender
    - cron: "0 17 * * 1-5"         # 12:00 m. revisión del mediodía
    - cron: "30 20 * * 1-5"        # 3:30 p.m. última llamada
    - cron: "0 1 * * 2-6"          # 8:00 p.m. resumen del día
    - cron: "15,45 12-23 * * 1-5"  # vigilancia cada 30 minutos, 7:15 a.m. a 6:45 p.m.
    - cron: "15,45 0-2 * * 2-6"    # vigilancia, 7:15 p.m. a 9:45 p.m.
    - cron: "0 21 * * 6,0"         # sábado y domingo 4:00 p.m. resumen de fin de semana
    - cron: "0 23 * * 0"           # domingo 6:00 p.m. backtest semanal
  workflow_dispatch:                # Para correr una tarea a mano desde GitHub (pestaña Actions)
    inputs:
      tarea:
        description: Tarea
        required: true
        default: vigilar
        type: choice
        options: [manana, apertura, mediodia, cierre, noche, vigilar, finde, backtest]
concurrency:
  group: datos                      # Una tarea a la vez: así no se pisan los archivos
  cancel-in-progress: false
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Bogota
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Elegir la tarea según la hora
        id: elegir
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * 1-5") t=manana ;;
            "45 14 * * 1-5") t=apertura ;;
            "0 17 * * 1-5") t=mediodia ;;
            "30 20 * * 1-5") t=cierre ;;
            "0 1 * * 2-6") t=noche ;;
            "0 21 * * 6,0") t=finde ;;
            "0 23 * * 0") t=backtest ;;
            "") t="${{ inputs.tarea }}" ;;
            *) t=vigilar ;;
          esac
          echo "tarea=$t" >> "$GITHUB_OUTPUT"
          case "$t" in vigilar|finde|backtest) echo "requisitos=requirements-tareas.txt" >> "$GITHUB_OUTPUT" ;;
                       *) echo "requisitos=requirements.txt" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ steps.elegir.outputs.requisitos }}
      - run: pip install -r ${{ steps.elegir.outputs.requisitos }}
      - run: python nube.py tarea ${{ steps.elegir.outputs.tarea }}

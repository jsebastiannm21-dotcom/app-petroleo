# Visita la app cada 4 horas para que Streamlit Community Cloud no la duerma (gratis).
name: Mantener la app despierta
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python despertar.py "${{ secrets.APP_URL }}"
